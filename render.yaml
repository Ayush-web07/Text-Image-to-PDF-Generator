services:
  - type: web
    name: text-image-to-pdf-generator
    runtime: python

    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate

    startCommand: gunicorn myproject.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11