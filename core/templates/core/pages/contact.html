{% extends "core/base.html" %}

{% block title %}Contact Us{% endblock %}

{% block content %}

<div class="container py-5">

<div class="text-center mb-5">

<h1 style="color: #f1f5f9;">Contact Us</h1>

<p style="color: #94a3b8;">

Need help? We'd love to hear from you.

</p>

</div>

<div class="row">

<div class="col-lg-6">

<div class="card border-secondary h-100" style="background: rgba(255,255,255,0.03); backdrop-filter: blur(20px);">

<div class="card-body">

<form>

<div class="mb-3">

<label style="color: #cbd5e1;">Name</label>

<input type="text" class="form-control" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #e2e8f0;">

</div>

<div class="mb-3">

<label style="color: #cbd5e1;">Email</label>

<input type="email" class="form-control" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #e2e8f0;">

</div>

<div class="mb-3">

<label style="color: #cbd5e1;">Message</label>

<textarea class="form-control" rows="6" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #e2e8f0;"></textarea>

</div>

<button class="btn w-100" style="background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: #fff; border: none; padding: 0.875rem; border-radius: 12px; font-weight: 600;">

Send Message

</button>

</form>

</div>

</div>

</div>

<div class="col-lg-6">

<h3 style="color: #f1f5f9;">Office</h3>

<p style="color: #94a3b8;">AI PDF Studio Pro</p>

<p style="color: #94a3b8;">Ayush</p>

<p style="color: #94a3b8;">Email: ayush98050@gmail.com</p>

<p style="color: #94a3b8;">Phone: +91-7876682432</p>

</div>

</div>

</div>

{% endblock %}
